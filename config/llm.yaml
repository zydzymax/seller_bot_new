default_provider: "openai"
# OpenAI-only конфигурация. GPT-5-first с автодетектом.
default_model: "gpt-5"

allowed_models:
  openai: ["gpt-5", "gpt-5-mini", "gpt-5-nano", "gpt-4o", "gpt-4-turbo"]

timeouts:
  connect_ms: 5000
  read_ms: 60000

retries:
  max_attempts: 3
  backoff_ms: 250

prefer_responses_api: true

circuit_breaker:
  failure_threshold: 5
  timeout: 60
  recovery_timeout: 120

cost_tracking:
  enabled: true
  currency: "RUB"
  gpt5_rub_per_1k_tokens: 0.8
  gpt4_turbo_rub_per_1k_tokens: 0.6

budgets:
  per_request_tokens: 6000          # max суммарно (prompt+response)
  per_minute_tokens: 60000          # soft cap (локально)
  monthly_tokens: 50_000_000        # общий бюджет на месяц (локально)
  action_on_exceed: "truncate"      # truncate|summarize|reject
truncate_strategy:
  prefer: "from_context_start"      # smart: суммаризировать старый контекст
  summarize_min_tokens: 800