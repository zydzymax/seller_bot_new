# SalesWhisper Tariffs Configuration
# Единый источник правды по ценам - используется ботом и сайтом
#
# ВАЖНО: При изменении цен здесь, нужно обновить:
# - /var/www/saleswhisper.pro/index.html (секция pricing)
# - /var/www/saleswhisper.pro/blog/*.html (упоминания цен)

min_price: 25000
currency: "RUB"
currency_symbol: "₽"

tariffs:
  - id: "start"
    name: "Старт"
    price_min: 25000
    price_max: 25000
    label: "Старт — 25 000 ₽"
    short_desc: "Базовый бот для старта"
    features:
      - "Бот в Telegram"
      - "Базовый сценарий (до ~15 шагов)"
      - "Вывод лидов в Google Sheet или Notion"
      - "7 дней поддержки после запуска"
    suitable_for: "Малый бизнес, до 50 заявок/месяц"

  - id: "standard"
    name: "Стандарт"
    price_min: 45000
    price_max: 60000
    label: "Стандарт — 45–60 000 ₽"
    short_desc: "Бот + CRM интеграция"
    features:
      - "Всё из тарифа «Старт»"
      - "Мини-аудит точек входа и воронки"
      - "Интеграция с CRM (amoCRM, Битрикс24 или другая)"
      - "30 дней сопровождения и докрутки"
    suitable_for: "Средний бизнес, 50-300 заявок/месяц"
    is_popular: true

  - id: "pro"
    name: "Про"
    price_min: 90000
    price_max: null  # null означает "от X"
    label: "Про — от 90 000 ₽"
    short_desc: "Комплексное решение"
    features:
      - "Несколько сценариев под разные продукты/аудитории"
      - "Отчёты и аналитика по диалогам"
      - "Работа совместно с РОПом/руководителем продаж"
      - "A/B-тесты сценариев и улучшения"
    suitable_for: "Крупный бизнес, 300+ заявок/месяц"

# Дополнительные услуги — ПОКА НЕТ ПУБЛИЧНЫХ ПРЕДЛОЖЕНИЙ
# additional_services: []

# Ежемесячные расходы (для информирования клиента)
monthly_costs:
  api_min: 2000
  api_max: 5000
  server_min: 500
  server_max: 2000
  note: "API (OpenAI/Claude) и серверы оплачиваются отдельно или включаются в тариф"

# Правила для бота
bot_rules:
  # Минимальный бюджет для работы
  min_budget_for_bot: 25000

  # Что говорить если бюджет меньше минимума
  low_budget_response: |
    Понимаю. Честно скажу: минимальная стоимость внедрения ИИ-продавца — 25 000 ₽.

    За меньший бюджет не получится сделать качественно — это будет либо простой бот-меню без AI, либо сырое решение, которое не окупится.

    Если сейчас не готовы — без проблем. Можем вернуться к разговору позже, когда бюджет позволит. Хотите, напомню через месяц-два?

  # Рекомендации тарифов по объёму заявок
  tariff_recommendations:
    - leads_max: 50
      tariff_id: "start"
    - leads_max: 300
      tariff_id: "standard"
    - leads_max: null  # больше 300
      tariff_id: "pro"
