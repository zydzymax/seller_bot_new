# Диагностические вопросы (DIAG_Q) — задаются БЕЗ LLM
# Максимум 2-3 вопроса, чтобы уточнить боль и желаемый результат

questions:
  # Вопрос 1: Уточнение боли (подставляется боль из prebot)
  - id: "confirm_pain"
    template: "Правильно понимаю, что сейчас больше всего мешает именно {pain}?"
    fallback: "Что сейчас больше всего мешает в обработке заявок?"
    slot_required: "pain"

  # Вопрос 2: Последствия боли
  - id: "pain_consequences"
    template: "К чему это приводит: к потере клиентов, перегрузке команды или чему-то ещё?"
    options:
      - "потеря клиентов"
      - "перегруз команды"
      - "хаос в CRM"
      - "упущенная выручка"
    saves_to: "pain_consequences"

  # Вопрос 3: Желаемый результат
  - id: "desired_result"
    template: "Какой результат вы бы считали успешным, если эту проблему решить?"
    saves_to: "desired_result"

# Условие выхода из DIAG_Q
exit_condition:
  # Переход в NEED_SUMMARY когда:
  # 1. Ответили на все 3 вопроса, ИЛИ
  # 2. Клиент сам чётко сформулировал боль + результат
  questions_required: 2  # минимум 2 вопроса
  max_questions: 3       # максимум 3 вопроса
