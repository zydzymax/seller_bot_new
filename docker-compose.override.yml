services:
  ai_seller:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: saleswhisper_ai_seller
    network_mode: host
    environment:
      - APP_ENV=production
      - POSTGRES_DSN=postgresql://sovani:[REVOKED_SECRET_REMOVED]@localhost:5433/saleswhisper_ai_seller
      - REDIS_URL=redis://localhost:6380/0
      - REDIS_ADDR=redis://localhost:6380/0
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - CLAUDE_API_KEY=${CLAUDE_API_KEY}
      - AI_SELLER_DOMAIN=${AI_SELLER_DOMAIN}
      - GOOGLE_SHEETS_CREDENTIALS=/app/ai-seller-480812-33e6f9bb0964.json
      - GOOGLE_SPREADSHEET_ID=${GOOGLE_SPREADSHEET_ID}
      - ADMIN_CHAT_ID=${ADMIN_CHAT_ID}
      - WEBHOOK_HOST=0.0.0.0
      - WEBHOOK_PORT=8001
      - HEALTHCHECK_PORT=8001
    volumes:
      - ./logs:/app/logs
      - ./temp:/app/temp
      - ./ai-seller-480812-33e6f9bb0964.json:/app/ai-seller-480812-33e6f9bb0964.json:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/healthz"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    command: ["uvicorn", "bot.webhook:app", "--host", "0.0.0.0", "--port", "8001", "--workers", "1"]
    restart: unless-stopped
