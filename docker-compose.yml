# Docker Compose для SoVAni AI-продавца (Python Core)
# © SoVAni 2025

version: '3.8'

services:
  # PostgreSQL для данных
  postgres:
    image: postgres:15-alpine
    container_name: saleswhisper_seller_postgres
    environment:
      POSTGRES_USER: sovani
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: saleswhisper_ai_seller
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/migrate_schema.sql:/docker-entrypoint-initdb.d/01_init.sql
    ports:
      - "5436:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sovani -d saleswhisper_ai_seller"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - saleswhisper_network

  # Redis для кэширования и сессий
  redis:
    image: redis:7-alpine
    container_name: saleswhisper_seller_redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - redis_data:/data
    ports:
      - "6383:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:?REDIS_PASSWORD is required} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - saleswhisper_network

  # Основное приложение AI-продавца (Python)
  ai_seller:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: saleswhisper_ai_seller
    environment:
      # Основные настройки
      - APP_ENV=${APP_ENV:-production}
      - APP_VERSION=1.0.0
      
      # API ключи
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - LEADS_API_KEY=${LEADS_API_KEY}
      - WIDGET_API_KEY=${WIDGET_API_KEY:-}
      - WIDGET_REQUEST_SECRET=${WIDGET_REQUEST_SECRET:-}
      - WIDGET_ALLOW_UNSIGNED_REQUESTS=${WIDGET_ALLOW_UNSIGNED_REQUESTS:-false}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY:-}
      
      # База данных
      - POSTGRES_DSN=postgresql://sovani:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/saleswhisper_ai_seller
      
      # Redis
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@saleswhisper_seller_redis:6379/0
      - REDIS_ADDR=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@saleswhisper_seller_redis:6379/0
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      
      # Webhook настройки
      - WEBHOOK_HOST=0.0.0.0
      - WEBHOOK_PORT=8000
      - WEBHOOK_SECRET_PATH=${WEBHOOK_SECRET_PATH:-SECRET}
      - TELEGRAM_WEBHOOK_SECRET=${TELEGRAM_WEBHOOK_SECRET:-}
      - TELEGRAM_WEBHOOK_ALLOW_SECRET_PATH_ALIAS=${TELEGRAM_WEBHOOK_ALLOW_SECRET_PATH_ALIAS:-false}
      
      # CRM настройки
      - AMOCRM_DOMAIN=${AMOCRM_DOMAIN:-your-domain.amocrm.ru}
      - AMOCRM_API_TOKEN=${AMOCRM_API_TOKEN:-}
      - AMOCRM_USER_HASH=${AMOCRM_USER_HASH:-}
      - AMOCRM_CLIENT_ID=${AMOCRM_CLIENT_ID:-}
      - AMOCRM_CLIENT_SECRET=${AMOCRM_CLIENT_SECRET:-}
      - AMOCRM_WIDGET_SECRET=${AMOCRM_WIDGET_SECRET:-}
      - AMOCRM_TOKENS_PREFIX=${AMOCRM_TOKENS_PREFIX:-amocrm:oauth:tokens}
      - AMOCRM_ALLOW_INSECURE_WEBHOOK=${AMOCRM_ALLOW_INSECURE_WEBHOOK:-false}
      
      # Rate Limiting
      - RATE_LIMIT_RPS=${RATE_LIMIT_RPS:-5}
      - RATE_LIMIT_BURST=${RATE_LIMIT_BURST:-10}
      - RATE_LIMIT_WINDOW=${RATE_LIMIT_WINDOW:-60}
      - RATE_LIMIT_FAIL_OPEN=${RATE_LIMIT_FAIL_OPEN:-false}
      
      # Idempotency
      - IDEMPOTENCY_TTL=${IDEMPOTENCY_TTL:-3600}
      - SESSION_TTL_SEC=${SESSION_TTL_SEC:-3600}
      
      # Input Sanitizer
      - MAX_INPUT_CHARS=${MAX_INPUT_CHARS:-2000}
      - SANITIZER_NORMALIZE_UNICODE=${SANITIZER_NORMALIZE_UNICODE:-true}
      - SANITIZER_XSS_PROTECTION=${SANITIZER_XSS_PROTECTION:-true}
      
      # Metrics и мониторинг
      - METRICS_BASIC_AUTH=${METRICS_BASIC_AUTH:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      
      # Domain настройки (ai_seller_self или textile_manufacturing)
      - AI_SELLER_DOMAIN=${AI_SELLER_DOMAIN:-ai_seller_self}

      # LLM настройки
      - LLM_DEFAULT_MODEL=${LLM_DEFAULT_MODEL:-gpt-4}
      - LLM_TEMPERATURE=${LLM_TEMPERATURE:-0.7}
      - LLM_MAX_TOKENS=${LLM_MAX_TOKENS:-1000}
      - LLM_MAX_RETRIES=${LLM_MAX_RETRIES:-3}
      - LLM_TIMEOUT_SECONDS=${LLM_TIMEOUT_SECONDS:-30}
      - TTS_MODEL=${TTS_MODEL:-gpt-4o-mini-tts}
      - TTS_FALLBACK_MODEL=${TTS_FALLBACK_MODEL:-tts-1-hd}
      - STT_MODEL=${STT_MODEL:-gpt-4o-mini-transcribe}
      - STT_FALLBACK_MODEL=${STT_FALLBACK_MODEL:-whisper-1}
      - AUDIO_SELFTEST_MONITOR_ENABLED=${AUDIO_SELFTEST_MONITOR_ENABLED:-true}
      - AUDIO_SELFTEST_INTERVAL_SEC=${AUDIO_SELFTEST_INTERVAL_SEC:-900}
      - AUDIO_SELFTEST_VOICE=${AUDIO_SELFTEST_VOICE:-nova}
      - AUDIO_SELFTEST_QUIET_ENABLED=${AUDIO_SELFTEST_QUIET_ENABLED:-true}
      - AUDIO_SELFTEST_QUIET_START_HOUR=${AUDIO_SELFTEST_QUIET_START_HOUR:-1}
      - AUDIO_SELFTEST_QUIET_END_HOUR=${AUDIO_SELFTEST_QUIET_END_HOUR:-8}
      - AUDIO_SELFTEST_QUIET_TZ=${AUDIO_SELFTEST_QUIET_TZ:-Europe/Moscow}
      - AUDIO_MONITOR_PING_ALLOW_LOCAL_NO_KEY=${AUDIO_MONITOR_PING_ALLOW_LOCAL_NO_KEY:-true}
      - PHOTO_VISION_ENABLED=${PHOTO_VISION_ENABLED:-true}
      - PHOTO_VISION_MODEL=${PHOTO_VISION_MODEL:-gpt-4o-mini}
      
    volumes:
      # Логи
      - ./logs:/app/logs
      # Временные файлы
      - ./temp:/app/temp
    command: ["uvicorn", "bot.webhook:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1", "--timeout-keep-alive", "30"]
    ports:
      - "8001:8000"  # FastAPI webhook
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - saleswhisper_network

  # Nginx reverse proxy - ОТКЛЮЧЕН (конфликт с системным nginx)
  # nginx:
  #   image: nginx:alpine
  #   container_name: sovani_nginx
  #   command: ["nginx", "-g", "daemon off;"]
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/nginx.conf:ro
  #   ports:
  #     - "8080:80"
  #     - "8443:443"
  #   depends_on:
  #     - ai_seller
  #   healthcheck:
  #     test: ["CMD", "curl", "-f", "http://localhost:80/health"]
  #     interval: 30s
  #     timeout: 5s
  #     retries: 3
  #   restart: unless-stopped
  #   networks:
  #     - saleswhisper_network
  #   deploy:
  #     replicas: 0

  # Prometheus для метрик
  prometheus:
    image: prom/prometheus:latest
    container_name: saleswhisper_prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    restart: unless-stopped
    networks:
      - saleswhisper_network

  # Grafana для визуализации метрик
  grafana:
    image: grafana/grafana:latest
    container_name: saleswhisper_grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin123}
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana:/etc/grafana/provisioning
    ports:
      - "3002:3000"
    restart: unless-stopped
    networks:
      - saleswhisper_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  grafana_data:
    driver: local
  prometheus_data:
    driver: local

networks:
  saleswhisper_network:
    driver: bridge
