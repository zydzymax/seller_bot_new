# Docker Compose для SoVAni AI-продавца (Python Core)
# © SoVAni 2025

version: '3.8'

services:
  # PostgreSQL для данных
  postgres:
    image: postgres:15-alpine
    container_name: sovani_postgres
    environment:
      POSTGRES_USER: sovani
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-[REVOKED_SECRET_REMOVED]}
      POSTGRES_DB: sovani_ai_seller
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/migrate_schema.sql:/docker-entrypoint-initdb.d/01_init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sovani -d sovani_ai_seller"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - sovani_network

  # Redis для кэширования и сессий
  redis:
    image: redis:7-alpine
    container_name: sovani_redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-[REVOKED_SECRET_REMOVED]}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - sovani_network

  # Основное приложение AI-продавца (Python)
  ai_seller:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sovani_ai_seller
    environment:
      # Основные настройки
      - APP_ENV=${APP_ENV:-production}
      - APP_VERSION=1.0.0
      
      # API ключи
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY:-}
      
      # База данных
      - POSTGRES_DSN=postgresql://sovani:${POSTGRES_PASSWORD:-[REVOKED_SECRET_REMOVED]}@postgres:5432/sovani_ai_seller
      
      # Redis
      - REDIS_ADDR=redis://sovani_redis:6379/0
      - REDIS_PASSWORD=${REDIS_PASSWORD:-[REVOKED_SECRET_REMOVED]}
      
      # Webhook настройки
      - WEBHOOK_HOST=0.0.0.0
      - WEBHOOK_PORT=8000
      - WEBHOOK_SECRET_PATH=${WEBHOOK_SECRET_PATH:-SECRET}
      
      # CRM настройки
      - AMOCRM_DOMAIN=${AMOCRM_DOMAIN:-your-domain.amocrm.ru}
      - AMOCRM_API_TOKEN=${AMOCRM_API_TOKEN:-}
      - AMOCRM_USER_HASH=${AMOCRM_USER_HASH:-}
      
      # Rate Limiting
      - RATE_LIMIT_RPS=${RATE_LIMIT_RPS:-5}
      - RATE_LIMIT_BURST=${RATE_LIMIT_BURST:-10}
      - RATE_LIMIT_WINDOW=${RATE_LIMIT_WINDOW:-60}
      
      # Idempotency
      - IDEMPOTENCY_TTL=${IDEMPOTENCY_TTL:-3600}
      - SESSION_TTL_SEC=${SESSION_TTL_SEC:-3600}
      
      # Input Sanitizer
      - MAX_INPUT_CHARS=${MAX_INPUT_CHARS:-2000}
      - SANITIZER_NORMALIZE_UNICODE=${SANITIZER_NORMALIZE_UNICODE:-true}
      - SANITIZER_XSS_PROTECTION=${SANITIZER_XSS_PROTECTION:-true}
      
      # Metrics и мониторинг
      - METRICS_BASIC_AUTH=${METRICS_BASIC_AUTH:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      
      # LLM настройки
      - LLM_DEFAULT_MODEL=${LLM_DEFAULT_MODEL:-gpt-4}
      - LLM_TEMPERATURE=${LLM_TEMPERATURE:-0.7}
      - LLM_MAX_TOKENS=${LLM_MAX_TOKENS:-1000}
      - LLM_MAX_RETRIES=${LLM_MAX_RETRIES:-3}
      - LLM_TIMEOUT_SECONDS=${LLM_TIMEOUT_SECONDS:-30}
      
    volumes:
      # Логи
      - ./logs:/app/logs
      # Временные файлы
      - ./temp:/app/temp
    ports:
      - "8000:8000"  # FastAPI webhook
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    restart: unless-stopped
    networks:
      - sovani_network

  # Nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: sovani_nginx
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - ai_seller
    restart: unless-stopped
    networks:
      - sovani_network

  # Prometheus для метрик
  prometheus:
    image: prom/prometheus:latest
    container_name: sovani_prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    restart: unless-stopped
    networks:
      - sovani_network

  # Grafana для визуализации метрик
  grafana:
    image: grafana/grafana:latest
    container_name: sovani_grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin123}
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana:/etc/grafana/provisioning
    ports:
      - "3000:3000"
    restart: unless-stopped
    networks:
      - sovani_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  grafana_data:
    driver: local
  prometheus_data:
    driver: local

networks:
  sovani_network:
    driver: bridge