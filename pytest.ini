[tool:pytest]
# pytest конфигурация для SoVAni AI-продавца
# © SoVAni 2025

[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Минимальный уровень покрытия
addopts = 
    --verbose
    --tb=short
    --strict-markers
    --disable-warnings

# Маркеры для категоризации тестов
markers =
    unit: Быстрые unit тесты
    integration: Интеграционные тесты
    slow: Медленные тесты
    redis: Тесты требующие Redis
    llm: Тесты взаимодействия с LLM
    crm: Тесты CRM интеграции
    telegram: Тесты Telegram bot API

# Переменные окружения для тестов
env = 
    APP_ENV=test
    LOG_LEVEL=WARNING
    REDIS_ADDR=redis://localhost:6379/15
    
# Фильтрация предупреждений
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore:.*unclosed.*:ResourceWarning