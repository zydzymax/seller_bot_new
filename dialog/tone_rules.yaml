style:
  address: "вы"          # уважительное обращение
  max_chars: 320         # лимит длины одной реплики
  emoji_policy: "confirm_only"  # эмодзи разрешены только в подтверждениях
  emoji_set: ["✅","👍"]
  do:
    - "краткие фразы, без канцелярита"
    - "вопрос — максимум один за сообщение"
    - "давать варианты + «Другое»"
  dont:
    - "повторять один и тот же вопрос"
    - "использовать жаргон"
    - "больше одного эмодзи"